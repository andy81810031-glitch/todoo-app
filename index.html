<!doctype html>
<html lang="zh-TW" class="bg-gray-50">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO App</title>
    <link rel="stylesheet" href="src/styles/style.css" />
    <script src="src/scripts/todo.js" type="module"></script>
  </head>

  <body x-data="todoapp" class="container px-2 py-4 mx-auto">
    <header class="banner">
      <h1><a @click.prevent="hasToken && gotoTaskForm()" href="#todo" class="taskLink">TODO!</a></h1>
      <div class="subtitle">
        <p class="text">Simple and Stupid TODO App</p>
        <p class="hidden text sm:block">
          powered by
          <a href="https://5xcampus.com" class="text-link" target="_blank">5xCampus</a>
          |
          <a href="https://todoo.5xcamp.us" class="text-link" target="_blank">API</a>
          |
          <a href="https://github.com/5xTraining/todoo-app" class="text-link" target="_blank">GitHub</a>
        </p>
      </div>
    </header>

    <main class="px-6 todo-app main">
      <header>
        <nav class="navbar">
          <a @click.prevent="logout" x-show="hasToken" class="signUpLink" href="#sign_out">登出</a>

          <a x-show="!hasToken" @click.prevent="gotoLogin" class="loginLink" href="#login">登入</a>
          <a x-show="!hasToken" @click.prevent="gotoSignUp" class="signUpLink" href="#sign_up">註冊</a>
        </nav>
      </header>

      <section id="userSection">
        <!-- Login Section start -->
        <section x-show="isLogin()" id="loginSection">
          <h1>登入</h1>
          <form id="loginForm" @submit.prevent="login">
            <div class="field">
              <label>
                <h3>Email</h3>
                <input x-model="email" type="email" id="loginEmail" autocomplete="email" spellcheck="false" placeholder="Email 信箱" />
              </label>
            </div>

            <div class="field">
              <label>
                <h3>密碼</h3>
                <input
                  x-model="password"
                  type="password"
                  id="loginPassword"
                  autocomplete="current-password"
                  spellcheck="false"
                  placeholder="密碼，至少需要 6 個字"
                />
              </label>
            </div>

            <div class="items-center justify-between block sm:flex field">
              <button type="submit">登入</button>
              <div class="text-xl text-gray-600">
                還沒有帳號嗎？<a @click.prevent="gotoSignUp" href="#sign_up" class="text-link signUpLink">註冊</a>一個吧！
              </div>
            </div>
          </form>
        </section>
        <!-- Login Section end -->

        <!-- Sign Up Section start -->
        <section x-show="isSignUp()" id="signUpSection">
          <h1>註冊帳號</h1>
          <form id="signUpForm" @submit.prevent="signup">
            <div class="field">
              <label>
                <h3>Email</h3>
                <input x-model="email" type="email" id="signUpEmail" autocomplete="email" spellcheck="false" placeholder="Email 信箱" />
              </label>
            </div>

            <div class="field">
              <label>
                <h3>暱稱</h3>
                <input
                  x-model="nickname"
                  type="text"
                  id="signUpNickname"
                  autocomplete="name"
                  spellcheck="false"
                  placeholder="要怎麼稱呼你呢？"
                />
              </label>
            </div>

            <div class="field">
              <label>
                <h3>密碼</h3>
                <input
                  x-model="password"
                  type="password"
                  id="signUpPassword"
                  autocomplete="new-password"
                  spellcheck="false"
                  placeholder="密碼，至少需要 6 個字"
                />
              </label>
            </div>

            <div class="items-center justify-between block sm:flex field">
              <button>註冊</button>
              <div class="text-xl text-gray-600">已經有帳號了？<a href="#" @click.prevent="gotoLogin" class="text-link loginLink">登入</a></div>
            </div>
          </form>
        </section>
        <!-- Sign Up Section end -->
      </section>

      <!-- TODO Section start -->
      <section x-show="isTaskForm()" id="taskSection">
        <form id="todoForm" @submit.prevent="addTodo">
          <input x-model="task" type="text" id="taskInput" autocomplete="off" spellcheck="false" placeholder="做點重要的事吧..." />
          <button id="addTodoBtn">新增</button>
        </form>
      </section>
      <!-- TODO Section end -->
    </main>

    <section x-show="hasToken" class="todo-list">
      <ul class="items">
        <!-- item start -->
        <template x-for="todo in todos" :key="todo.id">
          <li>
            <div class="item-content">
              <label>
                <input @click="toggleTodo(todo.id)" :checked="todo.completed_at" type="checkbox" />
                <p class="content" x-text="todo.content"></p>
              </label>
            </div>
            <div class="item-control">
              <a href="#" class="edit"><img class="icon" src="src/assets/pen-to-square-solid.svg" /></a>
              <a @click.prevent="removeTodo(todo.id)" href="#" class="delete"><img class="icon" src="src/assets/trash-can-solid.svg" /></a>
            </div>
          </li>
        </template>
        <!-- item end -->
      </ul>
    </section>
    <footer>
      <p>
        powered by
        <a href="https://5xcampus.com" class="underline">5XCAMPUS</a> | <a href="https://todoo.5xcamp.us" class="underline">API</a> |
        <a href="https://github.com/5xTraining/todoo-app" class="underline">SOURCE</a>
      </p>
    </footer>
  </body>
</html>
